# PartCAD package: MakerWorld models as parts, served by a repository plugin.
#
# Published as //pub/collection/makerworld/models: this package is
# //pub/collection/makerworld, and its one external dependency 'models' is served by
# the makerworld_repo plugin. Nothing is listed - a model site's catalog is not
# something to enumerate - so a part is asked for by name, and found with
# 'pc search parts' (see the README).
name: //pub/collection/makerworld

desc: |
  Models on MakerWorld (https://makerworld.com) as PartCAD parts, a part per
  file of a model, by the model's number. Nothing is listed: a part is asked for
  by name, and found with 'pc search parts'. No geometry is vendored; every file
  is fetched from MakerWorld when it is first built.
url: https://makerworld.com/

# The first PartCAD that has the toolkit this plugin is written with
# (plugin_models), and hands a repository plugin the key it is asked for
# taken apart ('query').
partcad: ">=0.9.20"

# An upload to a model site says nothing about whether, or how, it is made to
# be manufactured. The plugin says the same of 'models' in its metadata.
manufacturable: false

# What the plugin needs in the sandbox it runs in, beyond what PartCAD puts
# there: MakerWorld's preview meshes are Draco-compressed, which PartCAD's glTF
# reader does not decode, so the plugin writes them out plainly first.
pythonRequirements:
  - DracoPy>=2,<3

docs:
  name: MakerWorld for PartCAD
  usage: |
    ```shell
    pc search parts -P //pub/collection/makerworld/models -k "cable clip"
    pc inspect //pub/collection/makerworld/models:1400000
    pc inspect "//pub/collection/makerworld/models:1400000;source=preview"
    pc inspect "//pub/collection/makerworld/models:1400000;format=stl"
    ```

dependencies:
  models:
    type: external
    plugin: :makerworld_repo
    desc: MakerWorld models, a part per file.

repositories:
  makerworld_repo:
    type: basic
    path: makerworld_repo.py
    desc: Serves MakerWorld models as parts, and searches MakerWorld.
    # Every parameter here is a default for every MakerWorld part, and yours
    # to change without touching this package, two ways:
    #
    # - in your own ~/.partcad/config.yaml, under 'parameters', by the
    #   plugin's name - which is also where 'pc login' keeps the token:
    #
    #     parameters:
    #       //pub/collection/makerworld:makerworld_repo:
    #         formats: stl,3mf
    #
    # - or in a package of your own, as an enrich of the plugin and a package
    #   it serves, whose parts are then yours to name - '//makerworld_meshes:<model>'
    #   in a package at the root (never with credentials: those are yours,
    #   not a package's):
    #
    #     repositories:
    #       meshes_repo:
    #         type: enrich
    #         source: //pub/collection/makerworld:makerworld_repo
    #         with:
    #           formats: stl,3mf
    #     dependencies:
    #       makerworld_meshes:
    #         type: external
    #         plugin: :meshes_repo
    #
    # A part's own parameters override these for that part. Every part takes
    # 'file' (one of the model's files, by name or by id - 'preview-<profile>'
    # for a print profile's preview), 'format' (its best file of that format:
    # one of the 'formats' below) and 'source' (as below) - in its
    # name, '1400000;format=stl', or in the 'with' of an enrich of the part:
    #
    #     parts:
    #       clip:
    #         type: enrich
    #         source: //pub/collection/makerworld/models:1400000
    #         with:
    #           format: stl
    parameters:
      formats:
        type: string
        default: ""
        desc: >-
          The formats to take a model in, best first, separated by commas:
          step, brep, iges, 3mf, stl, obj, glb, usd, sldprt, ipt,
          catpart, f3d, fcstd, sat, pvz, scad. A format left out is
          not taken
          - 'stl,3mf' is meshes only - unless a part asks for it by its own
          'format' or 'file'. Empty is all of them, in that order.
      source:
        type: string
        default: auto
        enum: [auto, original, preview]
        desc: >-
          Which of a model's files: 'original', what the designer uploaded,
          which takes a signed-in MakerWorld account; 'preview', the mesh
          MakerWorld's viewer shows of a print profile, coarser and needing no
          account at all; or 'auto', the best original when there is a token,
          else a preview.
      # Empty here, and meant to stay so: a credential is the user's own, and
      # is set where only they see it.
      token:
        type: string
        default: ""
        desc: >-
          The access token of a signed-in MakerWorld (Bambu Lab) account: the
          'token' cookie of makerworld.com. Only the designer's own files need
          it; a preview needs nothing. 'pc login
          //pub/collection/makerworld:makerworld_repo' gets it in a browser and
          keeps it in your ~/.partcad/config.yaml, under 'parameters' as above;
          'pc login --agent' says how to get it by hand, and takes it back with
          '--set token=...'. The MAKERWORLD_TOKEN environment variable gives it
          too, where the plugin's sandbox sees the environment (a container
          does not). Never set it in a package.
